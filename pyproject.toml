[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning-shim"
version = "0.1.0"
description = "OpenAI-compatible shim that budgets reasoning and repairs stranded tool calls for Qwen3.5-template models on llama-server"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["starlette>=0.40", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reasoning-shim = "reasoning_shim:main"

[tool.hatch.build.targets.wheel]
include = ["reasoning_shim.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
